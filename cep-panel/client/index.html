<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles/chat.css">
  <title>EditFlow AI</title>
</head>
<body>
  <header id="app-header">
    <span class="logo">EditFlow AI</span>
    <span id="boot-tag" class="boot-tag" title="Frontend build tag — must match latest commit">build:unloaded</span>
    <span class="header-spacer"></span>
    <button id="btn-diagnostics" class="icon-btn" title="Diagnostics">&#9432;</button>
    <button id="btn-settings" class="icon-btn" title="Settings">&#9881;</button>
  </header>

  <!-- Inline fallback boot indicator — proves at least HTML is fresh.
       If this is hidden quickly, modules ARE loading. If it stays, modules failed. -->
  <div id="inline-boot-check" style="position:fixed;top:0;left:0;right:0;padding:4px 12px;background:#5a2d2d;color:#fff;font:11px monospace;text-align:center;z-index:9999">
    Boot pending — modules have not loaded yet. If this stays visible &gt; 3 seconds, see Help below.
  </div>
  <script>
    // Pure sync fallback: if main.js never runs, this banner stays visible and
    // tells the user what to do. main.js will hide it once it starts.
    window.__editflowBootStart = Date.now();
    setTimeout(function() {
      var el = document.getElementById('inline-boot-check');
      if (el && !el.dataset.cleared) {
        el.innerHTML = 'Boot FAILED. main.js never ran. Likely CEP cache. ' +
          'Try: close panel → close Premiere → delete %LOCALAPPDATA%\\Adobe\\CEP\\cache → reopen Premiere.';
      }
    }, 4000);
  </script>

  <main id="app-main">
    <!-- Stage 0 default view -->
    <div id="hero" class="hero">
      <button id="btn-scan" class="hero-btn">&#8853; Scan Project</button>
      <p class="hero-subtitle">Connect to your open Premiere project to begin.</p>
    </div>

    <!-- Stage 1+ view (hidden until first message) -->
    <div id="chat-scroll" class="chat-scroll hidden"></div>

    <!-- Drop overlay (shown during drag) -->
    <div id="drop-overlay" class="drop-overlay hidden">
      <span>Drop here: bin, clip, folder, or document</span>
    </div>
  </main>

  <footer id="app-footer" class="hidden">
    <div id="selection-chip" class="selection-chip hidden"></div>
    <div class="input-row">
      <textarea id="chat-input" rows="1" placeholder="Type a message, or drop a file&#8230;"></textarea>
      <button id="btn-attach" class="icon-btn" title="Attach script">&#128206;</button>
      <button id="btn-send" class="send-btn">Send</button>
    </div>
  </footer>

  <div id="settings-overlay" class="overlay hidden"></div>
  <div id="diagnostics-popover" class="popover hidden"></div>

  <script src="lib/CSInterface.js"></script>
  <!-- ?v= cache-buster: bump the value whenever main.js or its imports change
       to force CEP to fetch a fresh module graph instead of serving stale bytecode. -->
  <script type="module" src="src/main.js?v=20260525c"></script>
</body>
</html>
