<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EditFlow AI</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #181a1f;
      color: #eef1f7;
      font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(320px, calc(100vw - 40px));
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 700;
    }

    p {
      margin: 0 0 14px;
      color: #aeb6c6;
    }

    button {
      border: 0;
      border-radius: 6px;
      padding: 9px 13px;
      background: #2388ff;
      color: #f7fbff;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>EditFlow AI</h1>
    <p id="status">Opening panel through the local backend...</p>
    <button id="retry" type="button">Retry</button>
  </main>

  <script>
    (function () {
      var target = "http://127.0.0.1:8765/panel/index.html";
      var status = document.getElementById("status");
      var retry = document.getElementById("retry");

      function openPanel() {
        status.textContent = "Opening panel through the local backend...";
        fetch("http://127.0.0.1:8765/api/ping")
          .then(function (response) {
            if (!response.ok) throw new Error("Backend returned " + response.status);
            window.location.replace(target);
          })
          .catch(function () {
            status.textContent = "Start the backend with python run.py, then click Retry.";
          });
      }

      retry.addEventListener("click", openPanel);
      openPanel();
    })();
  </script>
</body>
</html>
